# Linux Speech Tools dependency metadata.
#
# Shell launchers remain in bin/, but Python dependencies are selected through
# uv extras so install profiles can stay explicit: core, kokoro/read, stt,
# gnome, or dev.

[project]
name = "linux-speech-tools"
version = "1.1.0"
description = "Text-to-speech and voice input tools for Linux systems"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Linux Speech Tools Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: System :: Shells",
]
requires-python = ">=3.8"

# Core dependencies shared by most scripts
dependencies = [
    "numpy>=1.20.0",
    "soundfile>=0.10.0",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "edge-tts>=6.1.0",
    "speechrecognition>=3.10.0",
]

[project.optional-dependencies]
# Audio processing dependencies
audio = [
    "librosa>=0.9.0",
    "scipy>=1.7.0",
    "pydub>=0.25.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyyaml>=6.0",
]

# High-quality neural TTS (heavy but worth it for quality!)
kokoro = [
    "kokoro-onnx>=0.1.0",
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
]

# Document reading and extraction helpers used by src/tts/say_read.py
read = [
    "readability-lxml>=0.8.1",
    "ebooklib>=0.18.0",
    "pdfminer.six>=20221105",
]

# Offline read-aloud profile: Kokoro plus document extraction helpers
reader = [
    "kokoro-onnx>=0.1.0",
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "readability-lxml>=0.8.1",
    "ebooklib>=0.18.0",
    "pdfminer.six>=20221105",
]

# Speech-to-text / dictation dependencies.
# numpy is intentionally NOT re-pinned here: the core "dependencies" above
# already require numpy (>=1.20.0) for every install, including stt, so the
# effective runtime floor is satisfied. The standalone legacy pip path
# (requirements-faster.txt) restates numpy>=1.24.0 because it installs without
# these core dependencies. Keep that floor aligned with core numpy if it is
# ever raised. (Adding a numpy specifier to this extra would change
# requires-dist and require regenerating uv.lock.)
stt = [
    "faster-whisper>=1.0.0",
    "webrtcvad>=2.0.10",
]

# Optional NVIDIA Parakeet ASR engine (Parakeet TDT 0.6B v3 via onnx-asr).
# Strictly opt-in: NOT part of `all`, so a default install is never bloated.
# faster-whisper stays the default engine (better LATAM Spanish). onnxruntime is
# already used by the kokoro/reader extras, so this adds little new weight.
# onnx-asr is MIT and downloads the model from Hugging Face on first use (or via
# `linux-speech-tools-setup --parakeet`). Enable with:
#   uv sync --extra stt --extra stt-parakeet
# onnx-asr requires Python >=3.10, so the marker keeps the project resolvable on
# 3.8/3.9 (where Parakeet is simply unavailable) while requires-python stays >=3.8.
# See docs/planning/PLUGGABLE_ASR_AND_PARAKEET.md.
stt-parakeet = [
    "onnx-asr[cpu,hub]>=0.11.0; python_version >= '3.10'",
]
stt-parakeet-gpu = [
    "onnx-asr[hub]>=0.11.0; python_version >= '3.10'",
    "onnxruntime-gpu[cuda,cudnn]==1.23.2; python_version >= '3.10'",
]

# Desktop integration helpers. GNOME settings and notification binaries remain
# system packages, but this keeps Python-side deps explicit for future modules.
gnome = []

# Lightweight TTS for basic usage
tts = [
    "pydub>=0.25.0",
]

# Everything needed for runtime features. Development tools stay in the dev
# extra/dependency group and are not part of a normal user install.
#
# IMPORTANT: this is a hand-maintained union of the core dependencies plus the
# audio, kokoro, read, and stt extras. It must be kept in sync manually when any
# of those change. A self-referential form (e.g.
# linux-speech-tools[kokoro,read,stt,audio]) would avoid the duplication but
# would rewrite requires-dist and force a uv.lock regeneration, so it is avoided
# here to preserve `uv sync --locked` against the committed uv.lock.
# Note: the "audio" extra (librosa/scipy/pydub) is only pulled in transitively
# via this "all" union; it has no dedicated installer flag.
all = [
    "numpy>=1.20.0",
    "soundfile>=0.10.0",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "edge-tts>=6.1.0",
    "speechrecognition>=3.10.0",
    "librosa>=0.9.0",
    "scipy>=1.7.0",
    "pydub>=0.25.0",
    "kokoro-onnx>=0.1.0",
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "readability-lxml>=0.8.1",
    "ebooklib>=0.18.0",
    "pdfminer.six>=20221105",
    "faster-whisper>=1.0.0",
    "webrtcvad>=2.0.10",
]

[project.urls]
Homepage = "https://github.com/pablopda/linux-speech-tools"
Repository = "https://github.com/pablopda/linux-speech-tools.git"
Issues = "https://github.com/pablopda/linux-speech-tools/issues"

# Shell scripts are still managed as standalone launchers in bin/.

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "audio: requires real audio input or playback hardware",
    "gnome: requires a live GNOME desktop session",
    "manual: manual diagnostic checks outside the default test run",
    "network: requires network access",
    "slow: long-running checks",
]
