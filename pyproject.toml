# Linux Speech Tools dependency metadata.
#
# Shell launchers remain in bin/, but Python dependencies are selected through
# uv extras so install profiles can stay explicit: core, kokoro/read, stt,
# gnome, or dev.

[project]
name = "linux-speech-tools"
version = "1.0.2"
description = "Text-to-speech and voice input tools for Linux systems"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Linux Speech Tools Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: System :: Shells",
]
requires-python = ">=3.8"

# Core dependencies shared by most scripts
dependencies = [
    "numpy>=1.20.0",
    "soundfile>=0.10.0",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "edge-tts>=6.1.0",
    "speechrecognition>=3.10.0",
]

[project.optional-dependencies]
# Audio processing dependencies
audio = [
    "librosa>=0.9.0",
    "scipy>=1.7.0",
    "pydub>=0.25.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# High-quality neural TTS (heavy but worth it for quality!)
kokoro = [
    "kokoro-onnx>=0.1.0",
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
]

# Document reading and extraction helpers used by src/tts/say_read.py
read = [
    "readability-lxml>=0.8.1",
    "ebooklib>=0.18.0",
    "pdfminer.six>=20221105",
]

# Offline read-aloud profile: Kokoro plus document extraction helpers
reader = [
    "kokoro-onnx>=0.1.0",
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "readability-lxml>=0.8.1",
    "ebooklib>=0.18.0",
    "pdfminer.six>=20221105",
]

# Speech-to-text / dictation dependencies
stt = [
    "faster-whisper>=1.0.0",
    "webrtcvad>=2.0.10",
]

# Desktop integration helpers. GNOME settings and notification binaries remain
# system packages, but this keeps Python-side deps explicit for future modules.
gnome = []

# Lightweight TTS for basic usage
tts = [
    "pydub>=0.25.0",
]

# Everything needed for runtime features. Development tools stay in the dev
# extra/dependency group and are not part of a normal user install.
all = [
    "numpy>=1.20.0",
    "soundfile>=0.10.0",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "edge-tts>=6.1.0",
    "speechrecognition>=3.10.0",
    "librosa>=0.9.0",
    "scipy>=1.7.0",
    "pydub>=0.25.0",
    "kokoro-onnx>=0.1.0",
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "readability-lxml>=0.8.1",
    "ebooklib>=0.18.0",
    "pdfminer.six>=20221105",
    "faster-whisper>=1.0.0",
    "webrtcvad>=2.0.10",
]

[project.urls]
Homepage = "https://github.com/pablopda/linux-speech-tools"
Repository = "https://github.com/pablopda/linux-speech-tools.git"
Issues = "https://github.com/pablopda/linux-speech-tools/issues"

# Shell scripts are still managed as standalone launchers in bin/.

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "audio: requires real audio input or playback hardware",
    "gnome: requires a live GNOME desktop session",
    "manual: manual diagnostic checks outside the default test run",
    "network: requires network access",
    "slow: long-running checks",
]
