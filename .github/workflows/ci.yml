name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            container: ubuntu:20.04
          - os: ubuntu-22.04
            container: ubuntu:22.04
          - os: debian-11
            container: debian:11
          - os: debian-12
            container: debian:12
          - os: fedora-38
            container: fedora:38
          - os: fedora-39
            container: fedora:39

    container: ${{ matrix.container }}

    steps:
    - name: Install Git (Ubuntu/Debian)
      if: contains(matrix.container, 'ubuntu') || contains(matrix.container, 'debian')
      run: |
        apt-get update
        apt-get install -y git curl

    - name: Install Git (Fedora)
      if: contains(matrix.container, 'fedora')
      run: |
        dnf update -y
        dnf install -y git curl

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies (Ubuntu/Debian)
      if: contains(matrix.container, 'ubuntu') || contains(matrix.container, 'debian')
      run: |
        apt-get update
        apt-get install -y python3 python3-dev ffmpeg espeak-ng portaudio19-dev libsndfile1-dev build-essential

    - name: Install dependencies (Fedora)
      if: contains(matrix.container, 'fedora')
      run: |
        # Enable RPM Fusion for ffmpeg
        dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
        dnf install -y python3 python3-devel gcc ffmpeg espeak-ng portaudio-devel libsndfile-devel

    - name: Make scripts executable
      run: chmod +x bin/* scripts/install/*.sh scripts/setup/*.sh scripts/release/*.sh

    - name: Test say command
      run: |
        echo "Testing say command..."
        bin/say --help

    - name: Test say-local command
      run: |
        echo "Testing say-local command..."
        bin/say-local --help

    - name: Install core Python dependencies
      run: |
        echo "Installing core dependencies for testing..."
        ~/.local/bin/uv sync --locked

    - name: Verify lockfile is current
      run: |
        ~/.local/bin/uv lock --check

    # Kokoro (onnxruntime/torch) and faster-whisper require Python 3.10+:
    # onnxruntime>=1.20 ships no cp38/cp39 wheels and torch>=2.5 no cp38 wheel.
    # Skip the neural-extra steps on the 3.8/3.9 runners (ubuntu:20.04,
    # debian:11) while keeping core coverage (say --help, uv sync, installer).
    - name: Test Python TTS script (core functionality)
      if: matrix.container != 'ubuntu:20.04' && matrix.container != 'debian:11'
      run: |
        echo "Testing Python TTS script core functionality..."
        ~/.local/bin/uv run --extra kokoro --extra read python src/tts/say_read.py --help

    - name: Test STT launcher capability check
      if: matrix.container != 'ubuntu:20.04' && matrix.container != 'debian:11'
      run: |
        ~/.local/bin/uv run --extra stt python -m src.stt.faster_whisper_auto --check

    - name: Test modern uv installer (dry-run)
      run: |
        echo "Testing modern uv installer with dry-run..."
        bash installer.sh --dry-run

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg espeak-ng portaudio19-dev python3-dev libsndfile1-dev

    - name: Install project dependencies
      run: |
        echo "Installing core project dependencies..."
        ~/.local/bin/uv sync --locked --extra read

    - name: Run integration tests
      run: |
        chmod +x bin/* scripts/install/*.sh scripts/setup/*.sh scripts/release/*.sh
        ~/.local/bin/uv run pytest tests/ -v

        echo "=== Manual Integration Tests ==="
        echo "1. Testing say command help..."
        bin/say --help

        echo "2. Testing script syntax and permissions..."
        bash -n bin/say
        test -x bin/say

        echo "3. Testing version reporting..."
        bin/say --version

        echo "4. Testing Python script with cached uv environment..."
        ~/.local/bin/uv run --extra kokoro --extra read python src/tts/say_read.py --help >/dev/null

        echo "5. Testing modern uv installer (full dry-run)..."
        bash installer.sh --dry-run >/dev/null
