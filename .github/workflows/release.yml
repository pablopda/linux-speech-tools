name: Release Packages

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

# A source-tag push alone must never create or publish a GitHub Release. The
# local release script creates a verified-tag draft, uploads the canonical
# source asset, pins its SHA in bootstrap-vX.Y.Z, smoke-tests that bootstrap,
# and only then publishes. This workflow validates the exact source tag and
# adds the optional distro packages to the existing release.
permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  validate:
    name: Validate exact source tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}

    steps:
      - name: Checkout the triggering tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $version" >&2
            exit 1
          fi
          if [[ "$(cat VERSION)" != "${version#v}" ]]; then
            echo "VERSION does not match tag $version" >&2
            exit 1
          fi
          source_commit="$(git rev-parse HEAD)"
          if [[ "$source_commit" != "$(git rev-list -n 1 "$version")" ]]; then
            echo "Checkout is not the exact source tag target" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Validate release candidate
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          bash scripts/release/pre-release-check.sh

  build-packages:
    name: Build ${{ matrix.package_type }} package
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        package_type: [deb, rpm]
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout the validated tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          persist-credentials: false

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot devscripts rpm

      - name: Create DEB package
        if: matrix.package_type == 'deb'
        run: |
          set -euo pipefail
          package_version="${VERSION#v}"
          package_name="linux-speech-tools"
          package_root="${package_name}_${package_version}"

          mkdir -p "$package_root/DEBIAN"
          mkdir -p "$package_root/usr/local/bin"
          mkdir -p "$package_root/usr/share/doc/$package_name"
          mkdir -p "$package_root/usr/share/$package_name"

          cp bin/* "$package_root/usr/local/bin/"
          chmod +x "$package_root/usr/local/bin"/*
          cp installer.sh VERSION "$package_root/usr/share/$package_name/"
          cp -r bin/ scripts/ src/ gnome-extension/ "$package_root/usr/share/$package_name/"
          cp pyproject.toml "$package_root/usr/share/$package_name/"
          [[ ! -f uv.lock ]] || cp uv.lock "$package_root/usr/share/$package_name/"
          [[ ! -f requirements-faster.txt ]] || cp requirements-faster.txt "$package_root/usr/share/$package_name/"
          [[ ! -f install-faster.sh ]] || cp install-faster.sh "$package_root/usr/share/$package_name/"
          cp README.md "$package_root/usr/share/doc/$package_name/"
          [[ ! -f README_FASTER.md ]] || cp README_FASTER.md "$package_root/usr/share/doc/$package_name/"
          [[ ! -d docs ]] || cp -r docs/ "$package_root/usr/share/doc/$package_name/"

          cat > "$package_root/DEBIAN/control" <<EOF
          Package: $package_name
          Version: $package_version
          Section: utils
          Priority: optional
          Architecture: all
          Depends: python3, python3-pip, ffmpeg, espeak-ng, curl, ca-certificates, tar
          Maintainer: Linux Speech Tools Team
          Description: Text-to-speech and voice input tools for Linux
           Command-line text-to-speech, dictation, and audio tools for Linux.
          EOF

          cat > "$package_root/DEBIAN/postinst" <<'EOF'
          #!/usr/bin/env bash
          set -e
          echo "Linux Speech Tools beta runtime package installed."
          echo "Complete user-local dependency setup as your normal user:"
          echo "  /usr/share/linux-speech-tools/installer.sh --with-kokoro --with-stt --no-system-deps"
          echo "The installer keeps the uv environment in your user data directory; it never writes under /usr/share."
          EOF
          chmod 755 "$package_root/DEBIAN/postinst"
          dpkg-deb --build "$package_root"
          printf 'PACKAGE_FILE=%s\n' "${package_root}.deb" >> "$GITHUB_ENV"

      - name: Create RPM package
        if: matrix.package_type == 'rpm'
        run: |
          set -euo pipefail
          package_version="${VERSION#v}"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          git archive --format=tar --prefix="linux-speech-tools-${package_version}/" HEAD \
            | gzip -n > "rpmbuild/SOURCES/linux-speech-tools-${package_version}.tar.gz"

          cat > rpmbuild/SPECS/linux-speech-tools.spec <<EOF
          Name: linux-speech-tools
          Version: $package_version
          Release: 1%{?dist}
          Summary: Text-to-speech and voice input tools for Linux
          License: MIT
          URL: https://github.com/pablopda/linux-speech-tools
          Source0: %{name}-%{version}.tar.gz
          BuildArch: noarch
          Requires: python3, python3-pip, ffmpeg-free, espeak-ng, curl, ca-certificates, tar

          %description
          Command-line text-to-speech, dictation, and audio tools for Linux.

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/local/bin %{buildroot}/usr/share/%{name} %{buildroot}/usr/share/doc/%{name}
          cp bin/* %{buildroot}/usr/local/bin/
          chmod +x %{buildroot}/usr/local/bin/*
          cp installer.sh VERSION pyproject.toml %{buildroot}/usr/share/%{name}/
          cp -r bin scripts src gnome-extension %{buildroot}/usr/share/%{name}/
          test ! -f uv.lock || cp uv.lock %{buildroot}/usr/share/%{name}/
          test ! -f requirements-faster.txt || cp requirements-faster.txt %{buildroot}/usr/share/%{name}/
          test ! -f install-faster.sh || cp install-faster.sh %{buildroot}/usr/share/%{name}/
          cp README.md %{buildroot}/usr/share/doc/%{name}/
          test ! -f README_FASTER.md || cp README_FASTER.md %{buildroot}/usr/share/doc/%{name}/
          test ! -d docs || cp -r docs %{buildroot}/usr/share/doc/%{name}/

          %post
          echo "Linux Speech Tools beta runtime package installed."
          echo "Complete user-local dependency setup as your normal user:"
          echo "  /usr/share/linux-speech-tools/installer.sh --with-kokoro --with-stt --no-system-deps"
          echo "The installer keeps the uv environment in your user data directory; it never writes under /usr/share."

          %files
          /usr/local/bin/*
          /usr/share/%{name}/*
          /usr/share/doc/%{name}/*

          %changelog
          * $(date '+%a %b %d %Y') GitHub Actions <noreply@github.com> - ${package_version}-1
          - Automated build from a validated source tag
          EOF

          rpmbuild --define "_topdir $(pwd)/rpmbuild" -ba rpmbuild/SPECS/linux-speech-tools.spec
          package_file="$(find rpmbuild/RPMS -type f -name 'linux-speech-tools-*.rpm' -print -quit)"
          test -n "$package_file"
          cp "$package_file" .
          printf 'PACKAGE_FILE=%s\n' "$(basename "$package_file")" >> "$GITHUB_ENV"

      - name: Preserve exact package bytes for testing and promotion
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.package_type }}
          path: ${{ env.PACKAGE_FILE }}
          if-no-files-found: error
          retention-days: 7

  test-deb-package:
    name: Test exact DEB artifact as non-root user
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    needs: build-packages

    steps:
      - name: Download exact DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package-deb

      - name: Install and exercise packaged user runtime
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(*.deb)
          (( ${#packages[@]} == 1 ))
          apt-get update
          apt-get install -y passwd util-linux "./${packages[0]}"
          test -x /usr/share/linux-speech-tools/installer.sh
          test -x /usr/share/linux-speech-tools/bin/linux-speech-tools-setup
          test -f /usr/share/linux-speech-tools/uv.lock
          test -f /usr/share/linux-speech-tools/requirements-faster.txt
          test -f /usr/share/linux-speech-tools/install-faster.sh
          useradd --create-home --shell /bin/bash lst-release-test
          runuser -u lst-release-test -- env \
            HOME=/home/lst-release-test \
            XDG_CONFIG_HOME=/home/lst-release-test/.config \
            XDG_DATA_HOME=/home/lst-release-test/.local/share \
            PATH=/home/lst-release-test/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/share/linux-speech-tools/installer.sh \
            --no-system-deps --no-path-edit --noninteractive
          test ! -e /usr/share/linux-speech-tools/.venv
          test -d /home/lst-release-test/.local/share/linux-speech-tools/uv-runtime
          test -x /home/lst-release-test/.local/bin/linux-speech-tools-setup
          cmp /usr/share/linux-speech-tools/bin/linux-speech-tools-setup \
            /home/lst-release-test/.local/bin/linux-speech-tools-setup
          runuser -u lst-release-test -- env \
            HOME=/home/lst-release-test \
            XDG_CONFIG_HOME=/home/lst-release-test/.config \
            PATH=/home/lst-release-test/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /home/lst-release-test/.local/bin/linux-speech-tools-setup --help

  test-rpm-package:
    name: Test exact RPM artifact as non-root user
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: build-packages

    steps:
      - name: Download exact RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package-rpm

      - name: Install and exercise packaged user runtime
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(*.rpm)
          (( ${#packages[@]} == 1 ))
          dnf install -y shadow-utils util-linux "./${packages[0]}"
          test -x /usr/share/linux-speech-tools/installer.sh
          test -x /usr/share/linux-speech-tools/bin/linux-speech-tools-setup
          test -f /usr/share/linux-speech-tools/uv.lock
          test -f /usr/share/linux-speech-tools/requirements-faster.txt
          test -f /usr/share/linux-speech-tools/install-faster.sh
          useradd --create-home --shell /bin/bash lst-release-test
          runuser -u lst-release-test -- env \
            HOME=/home/lst-release-test \
            XDG_CONFIG_HOME=/home/lst-release-test/.config \
            XDG_DATA_HOME=/home/lst-release-test/.local/share \
            PATH=/home/lst-release-test/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/share/linux-speech-tools/installer.sh \
            --no-system-deps --no-path-edit --noninteractive
          test ! -e /usr/share/linux-speech-tools/.venv
          test -d /home/lst-release-test/.local/share/linux-speech-tools/uv-runtime
          test -x /home/lst-release-test/.local/bin/linux-speech-tools-setup
          cmp /usr/share/linux-speech-tools/bin/linux-speech-tools-setup \
            /home/lst-release-test/.local/bin/linux-speech-tools-setup
          runuser -u lst-release-test -- env \
            HOME=/home/lst-release-test \
            XDG_CONFIG_HOME=/home/lst-release-test/.config \
            PATH=/home/lst-release-test/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /home/lst-release-test/.local/bin/linux-speech-tools-setup --help

  upload-packages:
    name: Upload tested package artifacts
    runs-on: ubuntu-latest
    needs: [validate, build-packages, test-deb-package, test-rpm-package]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Download tested DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package-deb
          path: packages

      - name: Download tested RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package-rpm
          path: packages

      - name: Bundle exact tested bytes and upload one release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb_packages=(packages/*.deb)
          rpm_packages=(packages/*.rpm)
          (( ${#deb_packages[@]} == 1 ))
          (( ${#rpm_packages[@]} == 1 ))
          bundle_name="linux-speech-tools-${VERSION#v}-native-packages.tar.gz"
          bundle_root="native-packages"
          mkdir "$bundle_root"
          cp -- "${deb_packages[0]}" "${rpm_packages[0]}" "$bundle_root/"
          (
            cd "$bundle_root"
            sha256sum -- "$(basename "${deb_packages[0]}")" \
              "$(basename "${rpm_packages[0]}")" > SHA256SUMS
          )
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --format=gnu -cf "${bundle_name%.gz}" -C "$bundle_root" .
          gzip -n "${bundle_name%.gz}"

          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir"' EXIT
          tar -xzf "$bundle_name" -C "$verify_dir"
          (
            cd "$verify_dir"
            sha256sum -c SHA256SUMS
          )
          cmp -- "${deb_packages[0]}" \
            "$verify_dir/$(basename "${deb_packages[0]}")"
          cmp -- "${rpm_packages[0]}" \
            "$verify_dir/$(basename "${rpm_packages[0]}")"
          for attempt in $(seq 1 24); do
            if gh release view "$VERSION" >/dev/null 2>&1; then
              existing_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
              if grep -Fqx "$bundle_name" <<<"$existing_assets"; then
                echo "Refusing to replace existing release asset: $bundle_name" >&2
                exit 1
              fi
              gh release upload "$VERSION" "$bundle_name"
              exit 0
            fi
            echo "Release $VERSION is not available yet (attempt $attempt/24)."
            sleep 5
          done
          echo "release.sh did not create the verified-tag release" >&2
          exit 1
